<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fancy Five | Specialty Food Association</title>
  <meta name="description" content="Fancy Five is a daily specialty food word game. Guess the five-letter food word in six tries.">

  css/fancy-five.css
</head>

<body>

<main class="ff-app" id="fancy-five-app">

  <header class="ff-header">
    <div class="ff-eyebrow">SPECIALTY FOOD ASSOCIATION</div>
    <h1>FANCY FIVE</h1>
    <p>The daily word game for people who know food.</p>
  </header>

  <section class="ff-game" aria-labelledby="ff-category">

    <div class="ff-meta">
      <div>
        <span>Today's category:</span>
        <strong id="ff-category"></strong>
      </div>
      <button class="ff-icon-btn" id="ff-help" type="button" aria-label="How to play">?</button>
    </div>

    <div id="ff-message" class="ff-message" role="status" aria-live="polite"></div>

    <div id="ff-board" class="ff-board" aria-label="Fancy Five game board"></div>

    <form id="ff-form" class="ff-form">
      <label class="sr-only" for="ff-input">Enter a five-letter word</label>
      <input
        id="ff-input"
        maxlength="5"
        autocomplete=
